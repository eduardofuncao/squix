<!doctype html>
<html>

<head>
  <title>Squix Terminal</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/index.css" />
  <link rel="stylesheet" href="./css/xterm.css" />
  <link rel="stylesheet" href="./css/xterm_customize.css" />
  <style>
    /* Load Maple Mono font from GitHub via jsDelivr CDN */
    @font-face {
      font-family: 'Maple Mono';
      src: url('https://cdn.jsdelivr.net/gh/subframe7536/maple-font@v7.9/MapleMono/webfonts/MapleMono-Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Maple Mono';
      src: url('https://cdn.jsdelivr.net/gh/subframe7536/maple-font@v7.9/MapleMono/webfonts/MapleMono-Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    /* Apply Maple Mono to all terminal elements */
    #terminal * {
      font-family: 'Maple Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace !important;
      font-variant-ligatures: none !important;
      font-feature-settings: normal !important;
      letter-spacing: normal !important;
    }

    .xterm-screen {
      font-family: 'Maple Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace !important;
      font-variant-ligatures: none !important;
    }

    .xterm-rows {
      font-family: 'Maple Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace !important;
      font-variant-ligatures: none !important;
    }

    .xterm-char-measure-element {
      font-family: 'Maple Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace !important;
      font-variant-ligatures: none !important;
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>
  <div id="terminal"></div>
  <script src="./auth_token.js"></script>
  <script src="./config.js"></script>
  <script src="./js/gotty.js"></script>
  <script>
    // Force Maple Mono and disable ligatures after page load
    document.addEventListener('DOMContentLoaded', function() {
      setTimeout(function() {
        const terminal = document.getElementById('terminal');
        if (terminal) {
          const allElements = terminal.querySelectorAll('*');
          allElements.forEach(function(el) {
            el.style.fontFamily = "'Maple Mono', 'DejaVu Sans Mono', 'Liberation Mono', 'Courier New', monospace";
            el.style.fontVariantLigatures = "none";
          });
        }
      }, 100);
    });
  </script>
</body>

</html>
